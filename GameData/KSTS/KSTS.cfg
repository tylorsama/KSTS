// KSTS mod settings. Edit the values below, or override them with a ModuleManager patch.
KSTS_SETTINGS
{
	// Tolerance bands for delivery orbits around a body other than the launch body:
	toleranceInclination = 2.0     // degrees
	toleranceEccentricity = 0.02   // unitless (eccentricity ratio)
	toleranceLAN = 2.0             // degrees (longitude of ascending node)

	// Deploy-altitude ceiling is capped this far below the destination body's SoI edge:
	ceilingSoiMargin = 1000        // meters

	// A payload part is marked "used" only if a massed resource drained more than this fraction of its
	// capacity during the recording (ignores slow life-support drain of empty crew pods):
	usedPartResourceThreshold = 0.01   // fraction of capacity (0.01 = 1%)

	// Global scale of the KSTS window (1.0 = default KSP size; clamped to 0.5..3.0):
	uiScale = 1.0

	// Log KSTS window sizing to KSP.log ("[KSTS-UI]" lines) to diagnose layout problems:
	debugUI = true

	// Interplanetary deliveries can only launch inside a transfer window; the tolerance is the window half-width:
	enforceTransferWindows = true
	transferWindowToleranceDeg = 3.0   // degrees
}
